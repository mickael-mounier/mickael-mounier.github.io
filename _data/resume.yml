summary:

  - Technical lead and senior engineer specializing in live multiplayer online
    systems, with nearly 20 years of software development experience and 10+
    years delivering and operating For Honor's online services across PC,
    PlayStation, and Xbox.

  - Leads backend architecture, game-client integration, dedicated servers,
    reliability, release operations, incident response, and cross-discipline
    delivery for live game services.


experience_page1:

  - position: Technical Lead
    company: Ubisoft - For Honor
    date: Dec 2022 - Present
    location: Montreal, Canada
    description:
      - Leads technical direction for 15+ For Honor live online services across
        PC, PlayStation, and Xbox, spanning backend architecture, service
        reliability, production operations, and game-client integration
      - Guides technical designs, reviews critical changes, mentors engineers,
        and supports incident response for live services
      - Coordinates online-service work across gameplay, UI, tools, DevOps,
        QA, and production stakeholders
      - Designed and coordinated For Honor's cross-progression transition (PC,
        PlayStation, Xbox) across backend services, game-client integration,
        data migration, first-party certification, release planning, and
        live operations for all active accounts with no major launch regressions
      - Improved service configuration, testing, and deployment pipelines to
        make six-week client updates and more frequent backend deployments safer
        and more repeatable
      - Contributed to player safety and game security initiatives, including
        anti-cheat integration, client-side hardening, and backend abuse
        mitigation

  - position: Online Developer
    company: Ubisoft - For Honor
    date: Sep 2016 - Dec 2022
    location: Montreal, Canada
    description:
      - Built and maintained multiple backend services supporting For Honor's
        live online experience
      - Delivered features across player progression, inventory, rewards,
        matchmaking, ranking, and game-client integration
      - Designed, maintained, and tuned matchmaking, skill rating, and ranking
        systems for live multiplayer populations
      - Contributed to the post-launch migration from P2P networking to
        dedicated servers by integrating AWS GameLift into the matchmaking
        stack and porting the dedicated server from Windows to Linux


